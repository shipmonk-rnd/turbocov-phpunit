name: Checks
on:
    workflow_dispatch:
    pull_request:
    push:
        branches:
            - "master"
jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            -
                name: Checkout code
                uses: actions/checkout@v6
            -
                name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.5
                    extensions: turbocov-shipmonk-rnd/turbocov@master
                    coverage: none
            -
                name: Install dependencies
                run: composer update --no-progress --prefer-dist --no-interaction
            -
                name: Run checks
                run: composer check

    tests:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: [ '8.4', '8.5' ]
                dependency-version: [ prefer-lowest, prefer-stable ]
        steps:
            -
                name: Checkout code
                uses: actions/checkout@v6
            -
                name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
                    extensions: turbocov-shipmonk-rnd/turbocov@master
                    coverage: none
                    ini-file: development
            -
                name: Update dependencies
                run: composer update --no-progress --${{ matrix.dependency-version }} --prefer-dist --no-interaction
            -
                name: Run tests
                run: composer check:tests
            -
                name: Run PHPStan
                run: composer check:types
